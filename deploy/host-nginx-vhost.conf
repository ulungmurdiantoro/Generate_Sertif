# Vhost untuk nginx HOST (bukan di dalam Docker) — dipakai bila server sudah
# punya nginx yang melayani domain lain.
#
# Pasang:
#   sudo cp deploy/host-nginx-vhost.conf /etc/nginx/sites-available/sertif.sistemedu.com
#   sudo ln -s /etc/nginx/sites-available/sertif.sistemedu.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sertif.sistemedu.com      # tambah blok 443 + redirect otomatis

server {
    listen 80;
    listen [::]:80;
    server_name sertif.sistemedu.com;

    # Samakan dengan MAX_UPLOAD_MB di .env (beri sedikit kelebihan).
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generate / split batch besar bisa lama.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
