<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">
      <i class="fa-solid fa-award"></i> {{ settings.app_name }}
    </a>
    <nav>
      <a href="/"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</a>
      <a href="/split"><i class="fa-solid fa-scissors"></i> Split PDF</a>
    </nav>
  </header>
  <main class="container">
    <div id="msg" class="msg" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
