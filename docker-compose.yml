services:
  app:
    build: .
    image: generator-sertifikat:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Selalu tulis ke volume, apa pun isi .env
      DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
