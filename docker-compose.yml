services:
  app:
    build: .
    image: generator-sertifikat:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Selalu tulis ke volume, apa pun isi .env
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # Hanya dengar di localhost — nginx host (atau reverse proxy lain di server
    # ini) yang meneruskan trafik publik + TLS ke sini.
    # Ganti 8000 di sisi kiri kalau port itu sudah dipakai.
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8000}:8000"
