server {
    listen 80;
    server_name _;

    # Naikkan bila MAX_UPLOAD_MB di .env dinaikkan (beri sedikit kelebihan).
    client_max_body_size 30m;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generate batch besar bisa lama.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---------------------------------------------------------------
    # HTTPS: cara termudah adalah menaruh Caddy / Traefik / nginx-proxy
    # + acme-companion di depan stack ini, ATAU jalankan certbot di host
    # dan tambahkan blok "listen 443 ssl;" dengan sertifikatnya di sini.
    # ---------------------------------------------------------------
}
